x-openclaw-launcher: &openclaw-launcher
  image: docker:29.9.2-cli@sha256:5e6baf67325a79f64ed3bed6863954d5e05d0f3d4e57cbdb14809346814bbfdb
  user: "1000:1000"
  group_add:
    - "${DOCKER_GID:-2375}"
  init: true
  read_only: true
  network_mode: none
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m
  environment:
    HOME: /tmp
    DOCKER_HOST: unix:///run/dind/docker.sock
    DOCKER_GID: ${DOCKER_GID:-2375}
    OPENCLAW_USER_BASE: ${OPENCLAW_USER_BASE:?Set OPENCLAW_USER_BASE to an absolute host path}
    OPENCLAW_GATEWAY_IMAGE: ${OPENCLAW_GATEWAY_IMAGE:-ghcr.io/treyturner/openclaw:latest}
    OPENCLAW_SANDBOX_IMAGE: ${OPENCLAW_SANDBOX_IMAGE:-ghcr.io/treyturner/openclaw-sandbox:latest}
    OPENCLAW_CONTROL_UI_ORIGIN: ${OPENCLAW_CONTROL_UI_ORIGIN:-http://127.0.0.1:18789}
    OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?Set OPENCLAW_GATEWAY_TOKEN}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    TICKTICK_API_TOKEN: ${TICKTICK_API_TOKEN:-}
  volumes:
    - type: volume
      source: dind-socket
      target: /run/dind
  configs:
    - source: openclaw-inner-compose
      target: /etc/openclaw/compose.yaml
    - source: openclaw-compose-script
      target: /etc/openclaw/compose.sh
  depends_on:
    openclaw-dind:
      condition: service_healthy
  entrypoint: ["/bin/sh", "/etc/openclaw/compose.sh"]

services:
  openclaw-dind:
    image: docker:29.9.2-dind@sha256:9e79b879b177fbd72c34376a3dd3d91747da5db49e1f560f76aea59561471977
    privileged: true
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      DOCKER_HOST: unix:///run/dind/docker.sock
      DOCKER_TLS_CERTDIR: ""
    # Explicit dockerd keeps the Docker API on the Unix socket only.
    command: ["dockerd", "--host=unix:///run/dind/docker.sock", "--group=${DOCKER_GID:-2375}"]
    ports:
      - "${OPENCLAW_PUBLISH_HOST:-127.0.0.1}:${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    volumes:
      - type: volume
        source: dind-data
        target: /var/lib/docker
      - type: volume
        source: dind-socket
        target: /run/dind
      - type: bind
        source: ${OPENCLAW_USER_BASE}
        target: ${OPENCLAW_USER_BASE}
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # One-shot controller: the gateway container itself is created inside DinD.
  openclaw-deploy:
    <<: *openclaw-launcher
    command: ["up", "--detach", "--wait"]

  openclaw-cli:
    <<: *openclaw-launcher
    profiles: ["cli"]
    stdin_open: true
    tty: true
    entrypoint: ["/bin/sh", "/etc/openclaw/compose.sh", "cli"]
    command: ["--help"]

volumes:
  dind-data:
  dind-socket:

configs:
  openclaw-inner-compose:
    file: ./compose.inner.yaml
  openclaw-compose-script:
    file: ./scripts/compose-inner.sh
