name: Push
description: Tag and push a Docker image to one authenticated registry

inputs:
  candidate-ref:
    description: "Fully-qualified candidate image ref to tag and push"
    required: true
  registry:
    description: "Exact registry hostname to select from refs; authenticate before calling this action"
    required: true
  refs:
    description: "Newline-separated list of fully-qualified image refs to filter by registry, tag and push"
    required: true

runs:
  using: composite
  steps:
    - name: Tag and push
      shell: bash -euo pipefail {0}
      env:
        CANDIDATE_REF: ${{ inputs.candidate-ref }}
        REGISTRY: ${{ inputs.registry }}
        REFS_RAW: ${{ inputs.refs }}
      run: |
        REFS=()
        while IFS= read -r ref; do
          ref="${ref%$'\r'}"
          [[ -n "$ref" && "${ref%%/*}" == "$REGISTRY" ]] || continue
          REFS+=("$ref")
        done <<< "${REFS_RAW}"

        if [[ ${#REFS[@]} -eq 0 ]]; then
          echo "::error::No image refs found for registry ${REGISTRY}"
          exit 1
        fi

        for ref in "${REFS[@]}"; do
          echo "Tagging ${CANDIDATE_REF} -> ${ref}"
          docker tag "${CANDIDATE_REF}" "${ref}"
          echo "Pushing ${ref}"
          docker push "${ref}"
        done
