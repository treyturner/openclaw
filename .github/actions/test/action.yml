name: Test
description: Test a gateway or sandbox candidate before publication

inputs:
  candidate-ref:
    description: "Fully-qualified image ref to test (ie. `registry.example.com/owner/repo:tag`)"
    required: true
  role:
    description: "Image role: gateway or sandbox"
    required: true

runs:
  using: composite
  steps:
    - name: Smoke test image role
      shell: bash -euo pipefail {0}
      env:
        CANDIDATE_REF: ${{ inputs.candidate-ref }}
        IMAGE_ROLE: ${{ inputs.role }}
      run: |
        bash "$GITHUB_ACTION_PATH/../../../tests/image-smoke.sh" "$IMAGE_ROLE" "$CANDIDATE_REF"
