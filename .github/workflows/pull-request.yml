name: Build and test pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test ${{ matrix.role }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: gateway
            upstream-ref: ghcr.io/openclaw/openclaw:latest
            cache-ref: ghcr.io/treyturner/openclaw:buildcache
          - role: sandbox
            upstream-ref: ghcr.io/jdx/mise:2026.10.17-debian
            cache-ref: ghcr.io/treyturner/openclaw-sandbox:buildcache
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Resolve base
        id: base
        uses: ./.github/actions/resolve/base
        with:
          upstream-image-ref: ${{ matrix.upstream-ref }}

      - name: Build candidate
        uses: docker/build-push-action@eb6512707bea5740b2608f2a43ece7bc543cb75b  # v7.0.0
        with:
          context: .
          file: Dockerfile.${{ matrix.role }}
          build-args: |
            BASE_REF=${{ matrix.upstream-ref }}@${{ steps.base.outputs.upstream_digest }}
          pull: true
          no-cache-filters: ${{ matrix.role }}
          cache-from: type=registry,ref=${{ matrix.cache-ref }}
          tags: openclaw-${{ matrix.role }}:pr-${{ github.event.pull_request.number }}
          load: true
          push: false

      - name: Smoke test candidate
        timeout-minutes: 10
        uses: ./.github/actions/test
        with:
          candidate-ref: openclaw-${{ matrix.role }}:pr-${{ github.event.pull_request.number }}
          role: ${{ matrix.role }}
