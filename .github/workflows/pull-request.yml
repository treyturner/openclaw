name: Build and test pull requests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    env:
      PR_IMAGE_TAG: pr-${{ github.event.pull_request.number }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Compose sandbox integration
            role: gateway
            cache-ref: ghcr.io/treyturner/openclaw:buildcache
          - name: Build and test sandbox-browser
            role: sandbox-browser
            cache-ref: ghcr.io/treyturner/openclaw-sandbox-browser:buildcache
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Login to DockerHub container registry (pull only)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Make room for both Docker image stores
        if: matrix.role == 'gateway'
        run: sudo rm -rf /usr/local/lib/android

      - name: Test base resolver
        if: matrix.role == 'sandbox-browser'
        run: python3 tests/resolve-base.py

      - name: Build ${{ matrix.role }} candidate
        uses: ./.github/actions/build-pr-candidate
        with:
          role: ${{ matrix.role }}
          cache-ref: ${{ matrix.cache-ref }}
          candidate-ref: openclaw-${{ matrix.role }}:${{ env.PR_IMAGE_TAG }}

      - name: Smoke test ${{ matrix.role }} candidate
        timeout-minutes: 10
        uses: ./.github/actions/test
        with:
          candidate-ref: openclaw-${{ matrix.role }}:${{ env.PR_IMAGE_TAG }}
          role: ${{ matrix.role }}

      # Keep both candidates on the same runner so Compose tests the PR's images.
      - name: Build sandbox candidate
        if: matrix.role == 'gateway'
        uses: ./.github/actions/build-pr-candidate
        with:
          role: sandbox
          upstream-ref: ghcr.io/jdx/mise:2026.10.17-debian
          cache-ref: ghcr.io/treyturner/openclaw-sandbox:buildcache
          candidate-ref: openclaw-sandbox:${{ env.PR_IMAGE_TAG }}

      - name: Smoke test sandbox candidate
        if: matrix.role == 'gateway'
        timeout-minutes: 10
        uses: ./.github/actions/test
        with:
          role: sandbox
          candidate-ref: openclaw-sandbox:${{ env.PR_IMAGE_TAG }}

      - name: Exercise nested gateway and sandbox creation
        if: matrix.role == 'gateway'
        timeout-minutes: 20
        run: |
          python3 tests/compose-smoke.py \
            "openclaw-gateway:$PR_IMAGE_TAG" \
            "openclaw-sandbox:$PR_IMAGE_TAG"
